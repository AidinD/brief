appId: io.github.aidind.brief
productName: Brief
directories:
  buildResources: resources

# Brief has no build step, so the packaged app ships src/ directly rather than a
# compiled out/. Same choice as Tend, and it has the same consequence: keel is a
# real dependency and has to be packed into the asar, because the preload still
# imports it at runtime.
files:
  - src/**
  - resources/**
  - package.json
  - "!src/**/*.test.mjs"

win:
  target:
    - nsis
  # The generated multi-size .ico, not the PNG: electron-builder would downscale
  # one 512px bitmap to 16px, which is what the simplified small drawing in
  # scripts/generate-icon.mjs exists to avoid.
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: AidinD
  repo: brief
  # Not the default. electron-builder defaults to a draft release, which
  # electron-updater cannot see at all - the app then reports "you are on the
  # latest version" forever. Loom lost two releases to this.
  releaseType: release
