<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Brief</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- The window is frameless, so this row is both the wordmark and the drag
         handle, and carries the window buttons. Same arrangement as the rest of
         the suite. -->
    <header class="app-header">
      <div class="brand">
        <!-- The mark, drawn inline rather than loaded from resources/icon.png:
             at 20px next to 17px text, a downscaled 512px bitmap is soft exactly
             where the eye is most critical.

             This is the icon's SMALL drawing - the wider body, the heavier
             stroke and the larger handle - for the same reason
             generate-icon.mjs switches below 32px: at this size a handle drawn
             to full-size proportions has its hole close up, and a cup with a
             filled handle is a bucket. Geometry matches FULL/SMALL there;
             change one, change the other. -->
        <svg class="brand-mark" width="20" height="20" viewBox="0 0 100 100" aria-hidden="true">
          <!-- userSpaceOnUse, not the default: it puts one ramp across the whole
               canvas, which is what diagonalRamp does in the generator. Per-shape
               objectBoundingBox would run the ramp twice and colour the handle
               differently from the body - and it renders nothing at all on a
               shape with no height, which is how Nib shipped an invisible slit
               for weeks. -->
          <linearGradient id="brief-mark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
            <stop offset="0" stop-color="#9a94f0" />
            <stop offset="1" stop-color="#6a60c9" />
          </linearGradient>
          <g
            stroke="url(#brief-mark)"
            stroke-width="11.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          >
            <path d="M16 27.5 L58.5 27.5 L54.5 77.5 L20 77.5 Z" />
            <!-- The handle, and the two ends land inside the body's right edge
                 rather than floating clear of it. The long way round the circle,
                 hence the large-arc flag: 210 degrees, so the counter is wide
                 enough to survive being 16px across. -->
            <path d="M60.25 33.49 A14.5 14.5 0 1 1 60.25 61.51" />
          </g>
        </svg>
        <span class="wordmark">Brief</span>
        <span class="version" id="version"></span>
      </div>
      <div class="header-right">
        <span class="dateline" id="dateline"></span>
        <!-- The send list lives on its own page rather than as a fourth section:
             the brief has to keep its bottom, and this is settings, not news. -->
        <button type="button" class="view-toggle" id="view-toggle" data-view="outbound">Sending</button>
        <div class="window-controls">
          <button type="button" data-window="minimize" title="Minimise">–</button>
          <button type="button" data-window="maximize" title="Maximise">□</button>
          <button type="button" data-window="close" class="danger" title="Close">×</button>
        </div>
      </div>
    </header>

    <!-- The scroller is this element, not the body. The header above is the
         window's only drag handle and carries its only close button, so it must
         not be allowed to scroll away. -->
    <main class="scroll">
      <div class="page" id="page"></div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
